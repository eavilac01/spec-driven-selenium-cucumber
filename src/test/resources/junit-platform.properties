# Paralelismo por escenario de Cucumber (ADR-002, R-3).
# Es seguro porque PicoContainer crea un Navegador por escenario, Cucumber corre
# todos los pasos de un escenario en un mismo hilo y no hay estado static mutable
# en src/main/java ni en src/test/java (solo constantes inmutables tras la carga).
# parallelism = SE_NODE_MAX_SESSIONS del Grid (docker-compose.yml y ci.yml).
# max-pool-size lo vuelve un tope real: sin él, el ForkJoinPool puede crear
# hilos de compensación y abrir más navegadores de los que el Grid admite.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.parallel.config.fixed.max-pool-size=2
