# Aplicacion y ejecucion
base.url=https://www.saucedemo.com
browser=chrome
headless=false
remote.url=
explicit.wait.seconds=10
browser.window.width=1920
browser.window.height=1080

# Contrato de navegacion de la aplicacion
route.inventory=inventory.html
route.cart=cart.html
route.checkout.information=checkout-step-one.html
route.checkout.summary=checkout-step-two.html
route.checkout.complete=checkout-complete.html

# Valores esperados de interfaz
inventory.expected.title=Products
inventory.remove-button.text=Remove
catalog.expected.count=6
catalog.expected.products=Sauce Labs Backpack,Sauce Labs Bike Light,Sauce Labs Bolt T-Shirt,Sauce Labs Fleece Jacket,Sauce Labs Onesie,Test.allTheThings() T-Shirt (Red)
catalog.expected.remaining-to-add=0
checkout.expected.confirmation=Thank you for your order!
cart.expected.count=2
cart.expected.products=Sauce Labs Backpack,Sauce Labs Bike Light
cart.expected.single-product.count=1
cart.expected.single-product.products=Sauce Labs Backpack
cart.expected.five-products.count=5
cart.expected.five-products.products=Sauce Labs Backpack,Sauce Labs Bike Light,Sauce Labs Bolt T-Shirt,Sauce Labs Fleece Jacket,Sauce Labs Onesie
cart.expected.all-products.count=6
cart.expected.all-products.products=Sauce Labs Backpack,Sauce Labs Bike Light,Sauce Labs Bolt T-Shirt,Sauce Labs Fleece Jacket,Sauce Labs Onesie,Test.allTheThings() T-Shirt (Red)
cart.expected.after-removal.count=1
cart.expected.after-removal.products=Sauce Labs Backpack
cart.expected.empty.counter-displayed=false
cart.expected.empty.count=0
checkout.expected.empty-cart.advances=false
checkout.expected.errors.first-name=Error: First Name is required
checkout.expected.errors.last-name=Error: Last Name is required
checkout.expected.errors.postal-code=Error: Postal Code is required

# Resultados y datos de prueba no sensibles
test.login.cases.locked-user.expected-error=Epic sadface: Sorry, this user has been locked out.
test.login.cases.invalid-password.expected-error=Epic sadface: Username and password do not match any user in this service
test.login.cases.nonexistent-user.username=nonexistent_user
test.login.cases.nonexistent-user.expected-error=Epic sadface: Username and password do not match any user in this service
test.login.cases.empty-username.expected-error=Epic sadface: Username is required
test.login.cases.empty-password.expected-error=Epic sadface: Password is required
test.login.cases.empty-both.expected-error=Epic sadface: Username is required
test.login.cases.anonymous-access.expected-error=Epic sadface: You can only access '/inventory.html' when you are logged in.
test.purchase.products=Sauce Labs Backpack,Sauce Labs Bike Light
test.purchase.single-product=Sauce Labs Backpack
test.purchase.five-products=Sauce Labs Backpack,Sauce Labs Bike Light,Sauce Labs Bolt T-Shirt,Sauce Labs Fleece Jacket,Sauce Labs Onesie
test.purchase.all-products=Sauce Labs Backpack,Sauce Labs Bike Light,Sauce Labs Bolt T-Shirt,Sauce Labs Fleece Jacket,Sauce Labs Onesie,Test.allTheThings() T-Shirt (Red)
