services:
  selenium-hub:
    image: selenium/hub@sha256:684d163880d558f217b29d24e992c5a52e0b130381ab7e1f79e9bad0414f753b # 4.45.0
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    environment:
      SE_SESSION_REQUEST_TIMEOUT: 300
      SE_SESSION_RETRY_INTERVAL: 5

  node-chrome:
    image: selenium/node-chrome@sha256:fae4a6dbb32939885ad92f8b7e1ed994179309d297c9e8b1fd39ea55af34ff4a # 4.45.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      # Igual a cucumber.execution.parallel.config.fixed.parallelism
      # (src/test/resources/junit-platform.properties) y al servicio de ci.yml.
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
