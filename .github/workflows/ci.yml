name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio para GITHUB_TOKEN: checkout solo lee el repo; la caché de
# setup-java y upload-artifact usan el token del runtime de Actions, no este.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USER_STANDARD_USERNAME: ${{ secrets.TEST_USER_STANDARD_USERNAME }}
      TEST_USER_STANDARD_PASSWORD: ${{ secrets.TEST_USER_STANDARD_PASSWORD }}
      TEST_LOGIN_CASES_LOCKED_USER_USERNAME: ${{ secrets.TEST_LOGIN_CASES_LOCKED_USER_USERNAME }}
      TEST_LOGIN_CASES_LOCKED_USER_PASSWORD: ${{ secrets.TEST_LOGIN_CASES_LOCKED_USER_PASSWORD }}
      TEST_LOGIN_CASES_INVALID_PASSWORD_USERNAME: ${{ secrets.TEST_LOGIN_CASES_INVALID_PASSWORD_USERNAME }}
      TEST_LOGIN_CASES_INVALID_PASSWORD_PASSWORD: ${{ secrets.TEST_LOGIN_CASES_INVALID_PASSWORD_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Traceability SDD (CHK-12)
        run: bash scripts/check-traceability.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify required secrets
        run: bash scripts/check-required-secrets.sh

      # CHK-08: suite completa (unitarias y E2E) sin los escenarios en cuarentena.
      # pipefail: el rc del paso es el de Maven (o el de tee), no solo el de tee.
      - name: Run tests (headless Chrome)
        id: maven
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp clean test -Dheadless=true -Dcucumber.filter.tags="not @quarantine" 2>&1 | tee test.log

      # ADR-003, R-2: el aviso de D3 (un esperado sobrescrito por -D, p. ej.
      # desde MAVEN_ARGS) hace fallar el job. Corre aunque Maven falle, en su
      # propio paso, así que no tapa el rc de Maven; sin log, falla cerrado.
      - name: Sin esperados sobrescritos por -D (ADR-003, R-2)
        if: ${{ !cancelled() && steps.maven.outcome != 'skipped' }}
        run: bash scripts/check-no-expected-override.sh test.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/cucumber-report.html
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: warn

  # ADR-002, R-6: ejercita la rama de Firefox de DriverFactory. Solo la suite
  # E2E (RunnerTest): las unitarias ya corren en `test`. Sin
  # -Dsurefire.failIfNoSpecifiedTests=false a propósito: si RunnerTest
  # desaparece, el job falla en vez de quedar en verde sin pruebas.
  e2e-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USER_STANDARD_USERNAME: ${{ secrets.TEST_USER_STANDARD_USERNAME }}
      TEST_USER_STANDARD_PASSWORD: ${{ secrets.TEST_USER_STANDARD_PASSWORD }}
      TEST_LOGIN_CASES_LOCKED_USER_USERNAME: ${{ secrets.TEST_LOGIN_CASES_LOCKED_USER_USERNAME }}
      TEST_LOGIN_CASES_LOCKED_USER_PASSWORD: ${{ secrets.TEST_LOGIN_CASES_LOCKED_USER_PASSWORD }}
      TEST_LOGIN_CASES_INVALID_PASSWORD_USERNAME: ${{ secrets.TEST_LOGIN_CASES_INVALID_PASSWORD_USERNAME }}
      TEST_LOGIN_CASES_INVALID_PASSWORD_PASSWORD: ${{ secrets.TEST_LOGIN_CASES_INVALID_PASSWORD_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify required secrets
        run: bash scripts/check-required-secrets.sh

      # Firefox viene preinstalado en ubuntu-latest; Selenium Manager resuelve geckodriver.
      - name: Firefox version
        run: firefox --version

      - name: Run E2E (headless Firefox)
        id: maven
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp clean test \
            -Dtest=RunnerTest \
            -Dbrowser=firefox -Dheadless=true \
            -Dcucumber.filter.tags="not @quarantine" 2>&1 | tee e2e-firefox.log

      # ADR-003, R-2: el aviso de D3 (un esperado sobrescrito por -D, p. ej.
      # desde MAVEN_ARGS) hace fallar el job. Corre aunque Maven falle, en su
      # propio paso, así que no tapa el rc de Maven; sin log, falla cerrado.
      - name: Sin esperados sobrescritos por -D (ADR-003, R-2)
        if: ${{ !cancelled() && steps.maven.outcome != 'skipped' }}
        run: bash scripts/check-no-expected-override.sh e2e-firefox.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-firefox
          path: |
            target/cucumber-report.html
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: warn

  # ADR-002, R-6: ejercita la rama RemoteWebDriver contra un Grid real. La
  # versión de la imagen coincide con selenium.version del pom y con
  # docker-compose.yml; SE_NODE_MAX_SESSIONS = paralelismo de Cucumber.
  e2e-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USER_STANDARD_USERNAME: ${{ secrets.TEST_USER_STANDARD_USERNAME }}
      TEST_USER_STANDARD_PASSWORD: ${{ secrets.TEST_USER_STANDARD_PASSWORD }}
      TEST_LOGIN_CASES_LOCKED_USER_USERNAME: ${{ secrets.TEST_LOGIN_CASES_LOCKED_USER_USERNAME }}
      TEST_LOGIN_CASES_LOCKED_USER_PASSWORD: ${{ secrets.TEST_LOGIN_CASES_LOCKED_USER_PASSWORD }}
      TEST_LOGIN_CASES_INVALID_PASSWORD_USERNAME: ${{ secrets.TEST_LOGIN_CASES_INVALID_PASSWORD_USERNAME }}
      TEST_LOGIN_CASES_INVALID_PASSWORD_PASSWORD: ${{ secrets.TEST_LOGIN_CASES_INVALID_PASSWORD_PASSWORD }}
    services:
      selenium:
        image: selenium/standalone-chrome:4.45.0
        ports:
          - 4444:4444
        options: --shm-size=2g
        env:
          SE_NODE_MAX_SESSIONS: 2
          SE_NODE_OVERRIDE_MAX_SESSIONS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify required secrets
        run: bash scripts/check-required-secrets.sh

      # Sondeo de /status con plazo: si el Grid no queda listo, el job falla.
      - name: Wait for Selenium Grid
        run: bash scripts/wait-for-grid.sh http://localhost:4444 120

      # -Dremote.url no produce el aviso de D3: es un destino de red (D5).
      - name: Run E2E (Selenium Grid, Chrome)
        id: maven
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp clean test \
            -Dtest=RunnerTest \
            -Dheadless=true -Dremote.url=http://localhost:4444 \
            -Dcucumber.filter.tags="not @quarantine" 2>&1 | tee e2e-grid.log

      # ADR-003, R-2: el aviso de D3 (un esperado sobrescrito por -D, p. ej.
      # desde MAVEN_ARGS) hace fallar el job. Corre aunque Maven falle, en su
      # propio paso, así que no tapa el rc de Maven; sin log, falla cerrado.
      - name: Sin esperados sobrescritos por -D (ADR-003, R-2)
        if: ${{ !cancelled() && steps.maven.outcome != 'skipped' }}
        run: bash scripts/check-no-expected-override.sh e2e-grid.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-grid
          path: |
            target/cucumber-report.html
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: warn

  # CHK-11 (ADR-001, D5), CHK-14 (cuarentena) y CHK-17 (ADR-002, D6): en
  # paralelo a `test`, sin secrets ni navegador. CHK-14 y CHK-17 van aquí y no
  # junto a CHK-12 porque `test` expone los secrets TEST_* a todos sus pasos
  # (env a nivel de job), y ni las autopruebas ni los scripts los necesitan.
  #
  # Las autopruebas que ejercitan awk corren con cada implementación: en el
  # runner `awk` es gawk y en Ubuntu de escritorio es mawk, y un programa que
  # solo se prueba con una puede fallar (o cambiar en silencio) con la otra.
  # --require hace fallar el paso si falta alguna (falla cerrado).
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Portabilidad de awk (estática y su autoprueba, runner de la matriz)
        run: |
          bash scripts/tests/check-awk-portability-test.sh
          bash scripts/check-awk-portability.sh
          bash scripts/tests/run-with-each-awk-test.sh

      - name: Capas, autoprueba con mawk, gawk y gawk --posix (CHK-17)
        run: bash scripts/run-with-each-awk.sh --require mawk --require gawk --require gawk-posix -- bash scripts/tests/check-layers-test.sh

      - name: Capas (CHK-17)
        run: |
          git --version
          bash scripts/check-layers.sh

      - name: Cuarentena, autoprueba con mawk, gawk y gawk --posix (CHK-14)
        run: bash scripts/run-with-each-awk.sh --require mawk --require gawk --require gawk-posix -- bash scripts/tests/check-quarantine-test.sh

      - name: Evaluador del job quarantine, autoprueba con mawk, gawk y gawk --posix (CHK-14)
        run: bash scripts/run-with-each-awk.sh --require mawk --require gawk --require gawk-posix -- bash scripts/tests/evaluate-quarantine-run-test.sh

      # Fecha del runner (UTC): una fila con el límite o la revisión vencidos
      # rompe el CI aunque nadie haya tocado el código.
      - name: Cuarentena reglada (CHK-14)
        run: bash scripts/check-quarantine.sh

      # ADR-003, R-2: el control de los jobs E2E, con logs sintéticos (sin awk).
      - name: Esperados sobrescritos por -D, autoprueba (ADR-003, R-2)
        run: bash scripts/tests/check-no-expected-override-test.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Pureza de src/main y aislamiento de las unitarias (CHK-15, CHK-16)
        run: bash scripts/check-unit-purity.sh

      - name: Mutation (CHK-11)
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage 2>&1 | tee pit.log

      - name: Guarda del reporte de mutación
        run: bash scripts/check-mutation-report.sh pit.log

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: target/pit-reports/
          if-no-files-found: warn

  # CHK-14: los escenarios @quarantine, en una sola ejecución (sin reintentos,
  # CHK-02) y sin continue-on-error. scripts/evaluate-quarantine-run.sh cruza el
  # rc de Maven, su log y el XML de Surefire con docs/quarantine.md:
  #   - verde: un `defecto-sut` que falla por aserción (lo esperado, ::notice::)
  #     o un `inestable` que falla por aserción o pasa (informativo, ::notice::);
  #   - verde con ::warning::: un `defecto-sut` que PASA (el SUT pudo haberse
  #     corregido: revisar la spec y la cuarentena) o un `inestable` que termina
  #     con <error> (excepción o timeout: revisar su diagnóstico; nombra el @AC-);
  #   - rojo: la cuarentena no mide nada o se rompe (un <error> de un
  #     `defecto-sut`, cero escenarios ejecutados, sin XML, Maven falló por otra
  #     causa que las pruebas, un escenario sin fila, o cualquier resultado que
  #     no cuadre).
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USER_STANDARD_USERNAME: ${{ secrets.TEST_USER_STANDARD_USERNAME }}
      TEST_USER_STANDARD_PASSWORD: ${{ secrets.TEST_USER_STANDARD_PASSWORD }}
      TEST_LOGIN_CASES_LOCKED_USER_USERNAME: ${{ secrets.TEST_LOGIN_CASES_LOCKED_USER_USERNAME }}
      TEST_LOGIN_CASES_LOCKED_USER_PASSWORD: ${{ secrets.TEST_LOGIN_CASES_LOCKED_USER_PASSWORD }}
      TEST_LOGIN_CASES_INVALID_PASSWORD_USERNAME: ${{ secrets.TEST_LOGIN_CASES_INVALID_PASSWORD_USERNAME }}
      TEST_LOGIN_CASES_INVALID_PASSWORD_PASSWORD: ${{ secrets.TEST_LOGIN_CASES_INVALID_PASSWORD_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sin escenarios en cuarentena no se arranca Maven ni el navegador: se
      # informa y el resto de pasos se omite. Un rc de git grep >= 2 es un
      # error, no "sin coincidencias".
      - name: Detectar escenarios en cuarentena
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          git grep -qE '(^|[[:space:]])@quarantine([[:space:]]|$)' -- src/test/resources/features || rc=$?
          case "$rc" in
            0) echo "present=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "present=false" >> "$GITHUB_OUTPUT"
               echo "Sin escenarios con @quarantine: no hay nada que ejecutar." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::git grep terminó con $rc"; exit 2 ;;
          esac

      - name: Set up JDK 17
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify required secrets
        if: steps.detect.outputs.present == 'true'
        run: bash scripts/check-required-secrets.sh

      # El rc de Maven se captura en la misma orden (PIPESTATUS, por el tee) y
      # se evalúa contra el XML: un fallo de compilación no deja XML ni la línea
      # "Tests run" de RunnerTest, así que no se confunde con un fallo esperado.
      # rc 3 del evaluador = aviso (un defecto-sut pasa o un inestable termina
      # con error): ya emitió el ::warning:: y el job sigue en verde. Cualquier
      # otro rc distinto de 0 es un error real.
      - name: Run @quarantine (headless Chrome) y evaluar
        id: maven
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./mvnw -B -ntp clean test -Dtest=RunnerTest -Dheadless=true -Dcucumber.filter.tags="@quarantine" 2>&1 | tee quarantine.log
          st=("${PIPESTATUS[@]}")
          set -e
          mvn_rc="${st[0]}"
          if [ "${st[1]}" -ne 0 ]; then
            echo "::error::tee terminó con ${st[1]}: el log de Maven está incompleto"
            exit 1
          fi
          rc=0
          bash scripts/evaluate-quarantine-run.sh --github --summary "$GITHUB_STEP_SUMMARY" "$mvn_rc" quarantine.log || rc=$?
          if [ "$rc" -eq 3 ]; then rc=0; fi
          exit "$rc"

      # ADR-003, R-2: el aviso de D3 (un esperado sobrescrito por -D, p. ej.
      # desde MAVEN_ARGS) hace fallar el job. Corre aunque Maven o el evaluador
      # fallen, en su propio paso, así que no tapa su rc; un aviso no se
      # degrada a ::warning:: como el rc 3 del evaluador: el job queda en rojo.
      - name: Sin esperados sobrescritos por -D (ADR-003, R-2)
        if: ${{ !cancelled() && steps.maven.outcome != 'skipped' }}
        run: bash scripts/check-no-expected-override.sh quarantine.log

      - name: Upload quarantine reports
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-reports
          path: |
            quarantine.log
            target/cucumber-report.html
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: warn
